<style id="gate-style">
/* Layout: one unlock card centred on graph paper, the same palette and type as the whitepaper page */
:root {
  --paper: #f5f6f8; --panel: #ffffff; --ink: #131821; --muted: #5d6776; --rule: #dce1e8; --grid: #e8ebf0;
  --accent: #0272b4; --accent-soft: rgba(2, 114, 180, 0.09); --on-accent: #ffffff; --danger: #b42318;
  --font-serif: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1116; --panel: #151a21; --ink: #e8ecf2; --muted: #98a2b0; --rule: #29303a; --grid: #1c222a;
    --accent: #38bdf8; --accent-soft: rgba(56, 189, 248, 0.13); --on-accent: #0e1116; --danger: #ff8a7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1116; --panel: #151a21; --ink: #e8ecf2; --muted: #98a2b0; --rule: #29303a; --grid: #1c222a;
  --accent: #38bdf8; --accent-soft: rgba(56, 189, 248, 0.13); --on-accent: #0e1116; --danger: #ff8a7a; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
.gate {
  box-sizing: border-box; min-height: 100%; display: grid; place-items: center;
  padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
}
.card { box-sizing: border-box; width: 100%; max-width: 27rem; padding: 30px 28px 26px; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 24px 60px -36px rgba(0, 0, 0, 0.35); }
.kicker { margin: 0 0 14px; font: 500 11.5px/1.4 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.card h1 { margin: 0; font: 500 2.5rem/1 var(--font-serif); letter-spacing: -0.025em; }
.card h1 em { font-weight: 400; }
.sub { margin: 12px 0 22px; color: var(--muted); font-size: 15px; }
.card label { display: block; margin-bottom: 6px; font: 600 13px/1.3 var(--font-sans); }
.row { display: flex; gap: 8px; }
.row input { flex: 1; min-width: 0; box-sizing: border-box; height: 42px; padding: 0 12px; font: 500 15px/1 var(--font-mono); color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 9px; }
.row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.row button { height: 42px; padding: 0 18px; font: 600 14px/1 var(--font-sans); color: var(--on-accent); background: var(--accent); border: 0; border-radius: 9px; cursor: pointer; }
.row button:disabled { opacity: 0.6; cursor: progress; }
.row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { min-height: 1.5em; margin: 10px 0 0; font-size: 13.5px; color: var(--danger); }
.note { margin: 14px 0 0; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--muted); }
</style>

<script>
(() => {
  const form = document.getElementById('gate-form');
  const input = document.getElementById('gate-pw');
  const btn = document.getElementById('gate-open');
  const msg = document.getElementById('gate-msg');
  const data = JSON.parse(document.getElementById('gate-data').textContent);
  const bytes = s => { const bin = atob(s); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
  const normalise = s => s.trim().toLowerCase().replace(/[\s_\-]+/g, '-');
  if (!(window.crypto && window.crypto.subtle && window.DOMParser)) {
    msg.textContent = 'This browser cannot unlock the page. Open it over https in a current version of Chrome, Edge, Firefox or Safari.';
    input.disabled = true; btn.disabled = true;
    return;
  }
  async function decrypt(pw) {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(data.salt), iterations: data.iter, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(data.iv) }, key, bytes(data.ct));
    return new TextDecoder().decode(plain);
  }
  function mount(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.head.querySelectorAll('link, style, meta[name="description"]').forEach(n => document.head.appendChild(document.importNode(n, true)));
    const gateStyle = document.getElementById('gate-style');
    if (gateStyle) gateStyle.remove();
    const nodes = Array.from(doc.body.childNodes).map(n => document.importNode(n, true));
    document.body.replaceChildren(...nodes);
    Array.from(document.body.querySelectorAll('script')).forEach(old => {
      const s = document.createElement('script');
      Array.from(old.attributes).forEach(a => s.setAttribute(a.name, a.value));
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
    if (doc.title) document.title = doc.title;
    window.scrollTo(0, 0);
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const pw = normalise(input.value);
    if (!pw) return;
    btn.disabled = true; btn.textContent = 'Opening…'; msg.textContent = '';
    let html;
    try {
      html = await decrypt(pw);
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Open';
      msg.textContent = 'That password doesn’t match. Check it and try again.';
      input.select();
      return;
    }
    try {
      mount(html);
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Open';
      msg.textContent = 'The page unlocked but could not be shown. Reload and try again.';
    }
  });
})();
</script>
